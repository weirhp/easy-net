name: Build Easy-Net Hook

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing client-lite Release tag to receive the full Windows x64 package (optional)
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - client-lite-v*
    paths:
      - client-hook/**
      - client-lite/**
      - .github/workflows/client-hook-build.yml
  pull_request:
    paths:
      - client-hook/**
      - client-lite/**
      - .github/workflows/client-hook-build.yml

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - Win32

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: client-lite/go.mod
          cache-dependency-path: client-lite/go.sum

      - name: Configure
        shell: pwsh
        run: cmake -S client-hook -B client-hook/build -A ${{ matrix.arch }}

      - name: Build
        shell: pwsh
        run: |
          $buildOutput = & cmake --build client-hook/build --config Release --parallel 2>&1 |
            Tee-Object -FilePath client-hook/build-output.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $buildOutput |
              Where-Object { "$_" -match '(?i)(error [A-Z]+[0-9]+|fatal error|cmake error|undefined reference|unresolved external)' } |
              Select-Object -Last 20 |
              ForEach-Object {
                $detail = "$_".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Host "::error title=Build error::$detail"
              }
            $diagnostics = ($buildOutput | Select-Object -Last 15 | ForEach-Object { "$_" }) -join "`n"
            $message = $diagnostics.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Build tail::$message"
            exit $buildExitCode
          }

      - name: Test
        shell: pwsh
        run: ctest --test-dir client-hook/build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $package = "client-hook/package/Easy-Net-Hook-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item client-hook/build/Release/easy-net-hook.exe -Destination $package
          Copy-Item client-hook/build/Release/easy-net-hook.dll -Destination $package
          Copy-Item client-hook/build/Release/Easy-Net-Lite.exe -Destination $package
          Copy-Item client-hook/build/Release/THIRD-PARTY-LICENSES -Destination $package -Recurse
          Copy-Item client-hook/README.md -Destination $package
          if ('${{ matrix.arch }}' -eq 'x64') {
            Copy-Item client-hook/build/Release/windivert -Destination $package -Recurse
            ./client-hook/scripts/install-mihomo.ps1 -Destination "$package/mihomo"
            ./client-hook/scripts/install-zeroomega.ps1 -Destination "$package/zeroomega"
            foreach ($required in @(
              "$package/windivert/easy-net-windivert.exe",
              "$package/mihomo/mihomo.exe",
              "$package/mihomo/LICENSE.txt",
              "$package/mihomo/VERSION.txt",
              "$package/zeroomega/chromium-release.zip",
              "$package/zeroomega/chromium-release.zip.sha256",
              "$package/zeroomega/COPYING.txt",
              "$package/zeroomega/VERSION.txt"
            )) {
              if (-not (Test-Path -LiteralPath $required)) {
                throw "Required x64 package file is missing: $required"
              }
            }
          }
          $forbidden = Get-ChildItem -LiteralPath $package -File -Recurse |
            Where-Object { $_.Name -in @('sing-box.exe', 'libcronet.dll') }
          if ($forbidden) {
            throw "Removed TUN files unexpectedly entered the package: $($forbidden.FullName -join ', ')"
          }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Easy-Net-Hook-${{ matrix.arch }}
          path: client-hook/package/Easy-Net-Hook-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

  release-full-windows-package:
    name: Release full Windows x64 package
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/client-lite-v')) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-full:client-lite-v'))
      }}
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download x64 package
        uses: actions/download-artifact@v8
        with:
          name: Easy-Net-Hook-x64
          path: release-package/Easy-Net-Hook-x64

      - name: Create full Windows package
        shell: bash
        run: |
          cd release-package
          zip -r -9 Easy-Net-Hook-Windows-x64-Full.zip Easy-Net-Hook-x64
          sha256sum Easy-Net-Hook-Windows-x64-Full.zip > Easy-Net-Hook-Windows-x64-Full.zip.sha256

      - name: Upload package to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/client-lite-v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          elif [[ -n "$REQUESTED_RELEASE_TAG" ]]; then
            RELEASE_TAG="$REQUESTED_RELEASE_TAG"
          elif [[ "$COMMIT_MESSAGE" =~ \[release-full:(client-lite-v[0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
            RELEASE_TAG="${BASH_REMATCH[1]}"
          else
            echo "No Release tag was supplied." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^client-lite-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported Release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          release_found=false
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              release_found=true
              break
            fi
            echo "Waiting for Release $RELEASE_TAG ($attempt/30)..."
            sleep 10
          done
          if [[ "$release_found" != true ]]; then
            echo "Release $RELEASE_TAG was not found after 5 minutes." >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" \
            release-package/Easy-Net-Hook-Windows-x64-Full.zip \
            release-package/Easy-Net-Hook-Windows-x64-Full.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
