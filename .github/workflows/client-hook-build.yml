name: Build Easy-Net Hook

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - client-hook/**
      - .github/workflows/client-hook-build.yml
  pull_request:
    paths:
      - client-hook/**
      - .github/workflows/client-hook-build.yml

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - Win32

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        shell: pwsh
        run: cmake -S client-hook -B client-hook/build -A ${{ matrix.arch }}

      - name: Build
        shell: pwsh
        run: |
          $buildOutput = & cmake --build client-hook/build --config Release --parallel 2>&1 |
            Tee-Object -FilePath client-hook/build-output.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $buildOutput |
              Where-Object { "$_" -match '(?i)(error [A-Z]+[0-9]+|fatal error|cmake error)' } |
              Select-Object -Last 20 |
              ForEach-Object {
                $message = "$_".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Host "::error::$message"
              }
            exit $buildExitCode
          }

      - name: Test
        shell: pwsh
        run: ctest --test-dir client-hook/build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $package = "client-hook/package/Easy-Net-Hook-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item client-hook/build/Release/easy-net-hook.exe -Destination $package
          Copy-Item client-hook/build/Release/easy-net-hook.dll -Destination $package
          Copy-Item client-hook/build/Release/THIRD-PARTY-LICENSES -Destination $package -Recurse
          Copy-Item client-hook/README.md -Destination $package

      - name: Package optional TUN engine
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $package = "client-hook/package/Easy-Net-Hook-x64-TUN"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item client-hook/build/Release/easy-net-hook.exe -Destination $package
          Copy-Item client-hook/build/Release/easy-net-hook.dll -Destination $package
          Copy-Item client-hook/build/Release/THIRD-PARTY-LICENSES -Destination $package -Recurse
          Copy-Item client-hook/README.md -Destination $package
          ./client-hook/scripts/install-tun-engine.ps1 -Destination "$package/tun"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Easy-Net-Hook-${{ matrix.arch }}
          path: client-hook/package/Easy-Net-Hook-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload package with TUN
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: Easy-Net-Hook-x64-TUN
          path: client-hook/package/Easy-Net-Hook-x64-TUN
          if-no-files-found: error
          retention-days: 14
