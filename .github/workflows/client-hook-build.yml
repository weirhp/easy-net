name: Build Easy-Net Hook

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - client-hook/**
      - client-lite/**
      - .github/workflows/client-hook-build.yml
  pull_request:
    paths:
      - client-hook/**
      - client-lite/**
      - .github/workflows/client-hook-build.yml

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - Win32

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: client-lite/go.mod
          cache-dependency-path: client-lite/go.sum

      - name: Configure
        shell: pwsh
        run: cmake -S client-hook -B client-hook/build -A ${{ matrix.arch }}

      - name: Build
        shell: pwsh
        run: |
          $buildOutput = & cmake --build client-hook/build --config Release --parallel 2>&1 |
            Tee-Object -FilePath client-hook/build-output.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $buildOutput |
              Where-Object { "$_" -match '(?i)(error [A-Z]+[0-9]+|fatal error|cmake error|undefined reference|unresolved external)' } |
              Select-Object -Last 20 |
              ForEach-Object {
                $detail = "$_".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Host "::error title=Build error::$detail"
              }
            $diagnostics = ($buildOutput | Select-Object -Last 15 | ForEach-Object { "$_" }) -join "`n"
            $message = $diagnostics.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Build tail::$message"
            exit $buildExitCode
          }

      - name: Test
        shell: pwsh
        run: ctest --test-dir client-hook/build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $package = "client-hook/package/Easy-Net-Hook-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item client-hook/build/Release/easy-net-hook.exe -Destination $package
          Copy-Item client-hook/build/Release/easy-net-hook.dll -Destination $package
          Copy-Item client-hook/build/Release/Easy-Net-Lite.exe -Destination $package
          Copy-Item client-hook/build/Release/THIRD-PARTY-LICENSES -Destination $package -Recurse
          Copy-Item client-hook/README.md -Destination $package
          if ('${{ matrix.arch }}' -eq 'x64') {
            Copy-Item client-hook/build/Release/windivert -Destination $package -Recurse
            ./client-hook/scripts/install-mihomo.ps1 -Destination "$package/mihomo"
            ./client-hook/scripts/install-zeroomega.ps1 -Destination "$package/zeroomega"
            foreach ($required in @(
              "$package/windivert/easy-net-windivert.exe",
              "$package/mihomo/mihomo.exe",
              "$package/mihomo/LICENSE.txt",
              "$package/mihomo/VERSION.txt",
              "$package/zeroomega/chromium-release.zip",
              "$package/zeroomega/chromium-release.zip.sha256",
              "$package/zeroomega/COPYING.txt",
              "$package/zeroomega/VERSION.txt"
            )) {
              if (-not (Test-Path -LiteralPath $required)) {
                throw "Required x64 package file is missing: $required"
              }
            }
          }
          $forbidden = Get-ChildItem -LiteralPath $package -File -Recurse |
            Where-Object { $_.Name -in @('sing-box.exe', 'libcronet.dll') }
          if ($forbidden) {
            throw "Removed TUN files unexpectedly entered the package: $($forbidden.FullName -join ', ')"
          }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Easy-Net-Hook-${{ matrix.arch }}
          path: client-hook/package/Easy-Net-Hook-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
