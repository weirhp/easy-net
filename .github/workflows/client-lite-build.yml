name: Build Easy-Net Lite

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - client-lite-v*
    paths:
      - client-lite/**
      - .github/workflows/client-lite-build.yml

permissions:
  contents: read

jobs:
  validate:
    name: Tests and security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: client-lite/go.mod
          cache-dependency-path: client-lite/go.sum

      - name: Run tests with race detector
        working-directory: client-lite
        shell: bash
        run: |
          set +e
          output="$(go test -race -count=1 ./... 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [[ $status -ne 0 ]]; then
            message="$(printf '%s\n' "$output" | tail -n 120)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Race test failure::$message"
          fi
          exit "$status"

      - name: Run static analysis
        working-directory: client-lite
        run: go vet ./...

      - name: Scan reachable vulnerabilities
        working-directory: client-lite
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  windows:
    name: Windows x64
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: client-lite/go.mod
          cache-dependency-path: client-lite/go.sum

      - name: Build Windows application
        working-directory: client-lite
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: Easy-Net-Lite-windows-x64
          path: client-lite/dist/Easy-Net-Lite.exe
          if-no-files-found: error
          retention-days: 14

  windows-full:
    name: Windows x64 full package
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: client-lite/go.mod
          cache-dependency-path: client-lite/go.sum

      - name: Configure Hook
        shell: pwsh
        run: cmake -S client-hook -B client-hook/build -A x64

      - name: Build Hook
        shell: pwsh
        run: cmake --build client-hook/build --config Release --parallel

      - name: Test Hook
        shell: pwsh
        run: ctest --test-dir client-hook/build -C Release --output-on-failure

      - name: Package full Windows application
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $package = "client-hook/package/Easy-Net-Hook-x64"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item client-hook/build/Release/easy-net-hook.exe -Destination $package
          Copy-Item client-hook/build/Release/easy-net-hook.dll -Destination $package
          Copy-Item client-hook/build/Release/Easy-Net-Lite.exe -Destination $package
          Copy-Item client-hook/build/Release/THIRD-PARTY-LICENSES -Destination $package -Recurse
          Copy-Item client-hook/build/Release/windivert -Destination $package -Recurse
          Copy-Item client-hook/README.md -Destination $package
          ./client-hook/scripts/install-mihomo.ps1 -Destination "$package/mihomo"
          ./client-hook/scripts/install-zeroomega.ps1 -Destination "$package/zeroomega"

          foreach ($required in @(
            "$package/easy-net-hook.exe",
            "$package/easy-net-hook.dll",
            "$package/Easy-Net-Lite.exe",
            "$package/windivert/easy-net-windivert.exe",
            "$package/mihomo/mihomo.exe",
            "$package/mihomo/LICENSE.txt",
            "$package/mihomo/VERSION.txt",
            "$package/zeroomega/chromium-release.zip",
            "$package/zeroomega/chromium-release.zip.sha256",
            "$package/zeroomega/COPYING.txt",
            "$package/zeroomega/VERSION.txt"
          )) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "Required full-package file is missing: $required"
            }
          }

          $forbidden = Get-ChildItem -LiteralPath $package -File -Recurse |
            Where-Object { $_.Name -in @('sing-box.exe', 'libcronet.dll') }
          if ($forbidden) {
            throw "Removed TUN files unexpectedly entered the package: $($forbidden.FullName -join ', ')"
          }

          Compress-Archive -LiteralPath $package `
            -DestinationPath client-hook/package/Easy-Net-Hook-Windows-x64-Full.zip `
            -CompressionLevel Optimal -Force

      - name: Upload full Windows package
        uses: actions/upload-artifact@v7
        with:
          name: Easy-Net-Hook-Windows-x64-Full
          path: client-hook/package/Easy-Net-Hook-Windows-x64-Full.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            package: Easy-Net-Lite-macos-arm64
          - runner: macos-15-intel
            arch: x64
            package: Easy-Net-Lite-macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: client-lite/go.mod
          cache-dependency-path: client-lite/go.sum

      - name: Build macOS application
        working-directory: client-lite
        env:
          EASY_NET_BUILD_VERSION: ${{ github.run_number }}
        run: bash ./scripts/build-macos.sh

      - name: Package macOS application
        working-directory: client-lite
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Easy-Net Lite.app" "dist/${{ matrix.package }}.zip"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: client-lite/dist/${{ matrix.package }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/client-lite-v')
    needs:
      - windows
      - windows-full
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < client-lite/VERSION)"
          expected_tag="client-lite-v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "标签 $GITHUB_REF_NAME 与 VERSION 中的 $version 不一致" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Easy-Net-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          mv release-assets/Easy-Net-Lite.exe release-assets/Easy-Net-Lite-windows-x64.exe
          cd release-assets
          sha256sum Easy-Net-Lite-* > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "Easy-Net Lite v${VERSION}" \
            --generate-notes
